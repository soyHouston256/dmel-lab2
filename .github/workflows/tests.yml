name: Pruebas CPU

on:
  push:
    paths:
      - 'dmel/**'
      - 'configs/**'
      - 'scripts/**'
      - 'slurm/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'dmel/**'
      - 'configs/**'
      - 'scripts/**'
      - 'slurm/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar PyTorch CPU y dependencias
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Comprobar ayuda sin dependencias importadas
        run: python -S -m dmel.cli train --help
      - name: Comprobar sintaxis Bash
        run: |
          for script in scripts/*.sh slurm/*.sh slurm/*.sbatch; do
            bash -n "$script"
          done
      - name: Ejecutar pruebas con datos sintéticos
        run: python -m pytest tests -q
